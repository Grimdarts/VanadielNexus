name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip -r requirements.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
