name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Check tag matches the app version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $m = Select-String -Path vanadiel_nexus/__init__.py -Pattern '^__version__ = "(.*)"$'
          $ver = $m.Matches[0].Groups[1].Value
          if ($ver -ne $tag) { throw "Tag v$tag doesn't match __version__ $ver" }

      - name: Install
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Test (a release never ships with failing tests)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Build exe
        run: python -m PyInstaller --noconfirm VanadielNexus.spec

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' dist/VanadielNexus.exe --title '${{ github.ref_name }}' --generate-notes
