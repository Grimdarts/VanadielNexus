name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Check tag matches APP_VERSION
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $m = Select-String -Path vanadielnexus_overlay.py -Pattern '^APP_VERSION = "(.*)"$'
          $ver = $m.Matches[0].Groups[1].Value
          if ($ver -ne $tag) { throw "Tag v$tag doesn't match APP_VERSION $ver" }

      - name: Build exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm VanadielNexus.spec

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' dist/VanadielNexus.exe --title '${{ github.ref_name }}' --generate-notes
